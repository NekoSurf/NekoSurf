name: TestFlight Status

# Apple reviews each new TestFlight build before testers on the public link
# can install it, often a day or two after the GitHub release. Once the
# latest release's build is live, this appends a hidden marker comment to
# the release notes; the iOS app only offers the update after that.
#
# While a release isn't live yet, a run stays and asks Apple every 5 minutes.
# GitHub only starts a few of the scheduled runs a day, so waiting for the
# next one could add hours. Prepare Release starts one when it publishes, and
# the schedule is what picks it up again after a run's time is over.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency: testflight-status

env:
  BUNDLE_ID: com.wrngwrld.Chanyan

jobs:
  check:
    name: Mark the release once it's on TestFlight
    runs-on: ubuntu-latest
    # GitHub stops a job after 6 hours; the wait below ends before that.
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          MARKED=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body \
            --jq '(.body // "") | contains("<!-- testflight: live -->")')
          BUILD=$(sed -nE 's/.*\+([0-9]+)$/\1/p' <<< "$TAG")

          echo "Latest release $TAG (build ${BUILD:-none}), marked: $MARKED"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          if [ "$MARKED" = "false" ] && [ -n "$BUILD" ]; then
            echo "check=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.release.outputs.check
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - if: steps.release.outputs.check
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - if: steps.release.outputs.check
        run: pip install "pyjwt[crypto]"

      - name: Mark the release if its build is on TestFlight
        if: steps.release.outputs.check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TAG: ${{ steps.release.outputs.tag }}
          BUILD: ${{ steps.release.outputs.build }}
        run: |
          until python .github/scripts/testflight_ready.py "$BUNDLE_ID" "$BUILD"; do
            if (( SECONDS > 19800 )); then
              echo "Build $BUILD isn't on TestFlight yet; the next run takes over"
              exit 0
            fi
            sleep 300
            # A newer release is the next run's to watch, which waits for this one.
            LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName || echo "$TAG")
            if [ "$LATEST" != "$TAG" ]; then
              echo "$LATEST is out now; leaving it to the next run"
              exit 0
            fi
          done

          # Hidden on GitHub; the app looks for it in the release body.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' \
            > "$RUNNER_TEMP/notes.md"
          printf '\n\n<!-- testflight: live -->\n' >> "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Marked $TAG as available on TestFlight"
