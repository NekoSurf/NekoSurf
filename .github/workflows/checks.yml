name: Checks

# The analyzer and the tests, on every push to main and every PR. Prepare
# Release runs them as well, before it bumps the version and tags.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to check (empty = triggering ref)"
        type: string
        default: ""

env:
  # Keep in step with _build.yml and ios/ci_scripts/ci_post_clone.sh.
  FLUTTER_VERSION: "3.47.9"

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # iCloud sync's rules, in Swift (the runner has it).
      - run: swift test --package-path ios/SyncRules
