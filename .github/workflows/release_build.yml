name: Build and Upload Release Artifacts

# This workflow can run on release publish or manually from Actions.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload artifacts to (optional for manual runs)"
        required: false
        type: string
      build_ios:
        description: "Build iOS IPA"
        required: true
        default: true
        type: boolean
      build_android:
        description: "Build Android APK"
        required: true
        default: true
        type: boolean

jobs:
  build_ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    if: ${{ github.event_name == 'release' || github.event.inputs.build_ios == 'true' }}

    steps:
      - name: "📩 Checkout actions/checkout@v1"
        uses: actions/checkout@v4

      - name: "🍎 Select Xcode"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: "🧩 Verify iOS SDK availability"
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          if ! xcodebuild -showsdks | grep -q "iphoneos"; then
            echo "No iphoneos SDK found on this runner/Xcode selection."
            exit 1
          fi

      - name: "🦋 Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: "stable"

      - name: "❓ Verify Flutter"
        run: flutter doctor

      - name: "📦 Install dependencies"
        run: flutter pub get

      - name: "🏗️ Build iOS app"
        run: |
          flutter build ios --release --no-codesign --verbose

      - name: "🔨 Create IPA"
        run: |
          APP_DIR="build/ios/Release-iphoneos"
          OUTPUT_DIR="build/ios/ipa"
          APP_NAME=$(find "$APP_DIR" -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_NAME" ]; then
            echo "No .app found in $APP_DIR"
            exit 1
          fi
          APP_BASENAME=$(basename "$APP_NAME" .app)
          mkdir -p "$OUTPUT_DIR/Payload"
          cp -r "$APP_NAME" "$OUTPUT_DIR/Payload/"
          cd "$OUTPUT_DIR"
          zip -r "$APP_BASENAME.ipa" Payload
          rm -rf Payload
          echo "Created IPA: $OUTPUT_DIR/$APP_BASENAME.ipa"

      - name: "🚀 Upload IPA to Release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.release_tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "No release tag provided; skipping IPA upload."
            exit 0
          fi

          IPA_FILES=(build/ios/ipa/*.ipa)
          if [ ! -e "${IPA_FILES[0]}" ]; then
            echo "No IPA files found in build/ios/ipa"
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${IPA_FILES[@]}"

  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || github.event.inputs.build_android == 'true' }}

    steps:
      - name: "📩 Checkout actions/checkout@v4"
        uses: actions/checkout@v4

      - name: "☕️ Setup Java"
        uses: actions/setup-java@v1
        with:
          java-version: "17.x"

      - name: "🦋 Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: "stable"

      - name: "❓ Verify Flutter"
        run: flutter doctor

      - name: "📦 Install dependencies"
        run: flutter pub get

      - name: "📦 Set Gradle Heap Size"
        run: echo "GRADLE_OPTS=-Xmx2048m" >> $GITHUB_ENV

      - name: "🚀 Build APK"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.release_tag }}
        run: |
          flutter build apk --split-per-abi

          if [ -z "$RELEASE_TAG" ]; then
            echo "No release tag provided; skipping APK upload."
            exit 0
          fi

          gh release upload "$RELEASE_TAG" build/app/outputs/apk/release/app-arm64-v8a-release.apk
          gh release upload "$RELEASE_TAG" build/app/outputs/apk/release/app-armeabi-v7a-release.apk
          gh release upload "$RELEASE_TAG" build/app/outputs/apk/release/app-x86_64-release.apk
        shell: bash
