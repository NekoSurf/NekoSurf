name: Build and Upload Release Artifacts

# Runs on release publish or manually from Actions.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload artifacts to (optional for manual runs)"
        required: false
        type: string
      build_ios:
        description: "Build iOS IPA"
        required: true
        default: true
        type: boolean
      build_android:
        description: "Build Android APK"
        required: true
        default: true
        type: boolean

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      release_tag: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
      build_android: ${{ github.event_name == 'release' || inputs.build_android }}
      build_ios: ${{ github.event_name == 'release' || inputs.build_ios }}

  upload:
    name: Upload to Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Download artifacts
        if: ${{ env.RELEASE_TAG != '' }}
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to release
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "No release tag provided; skipping upload."
            exit 0
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY"
