name: Prepare Release

# Bumps pubspec to <version>+<next Xcode Cloud build number>, tags it (which
# starts Xcode Cloud), creates the GitHub release, builds and uploads the
# APK/IPA, and adds the version to source.json.
#
# Pushes to the protected main branch with the RELEASE_DEPLOY_KEY deploy key,
# which is on the main ruleset's bypass list.
#
# The release is titled with its tag. What it says comes from files
# committed to main before running, which the release commit removes, so
# none is used twice:
#
# - RELEASE_SUMMARY.txt (required): one line, AltStore's description of the
#   version in source.json, and the fallback for the other two.
# - RELEASE_NOTES.md: the GitHub release description.
# - WHAT_TO_TEST.txt: TestFlight's "What to Test", plain text (TestFlight
#   shows Markdown as typed), up to 4000 characters. The release commit
#   writes it to ios/TestFlight/WhatToTest.en-US.txt, which Xcode Cloud
#   reads from the tagged commit, replacing the last release's.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 0.11.6"
        required: true
        type: string

concurrency: release

env:
  BUNDLE_ID: com.wrngwrld.Chanyan

jobs:
  # Nothing is tagged or pushed if the analyzer or a test fails. They check
  # the commit main was at when the release started, the one prepare
  # releases.
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.sha }}

  prepare:
    name: Bump version and tag
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      summary: ${{ steps.texts.outputs.summary }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # A commit that landed while the checks ran wasn't checked. Later
      # ones make the push to main fail.
      - name: Make sure main is the checked commit
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::main isn't at $GITHUB_SHA, the commit that was checked. Start the release from main, and again if main moved meanwhile."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install "pyjwt[crypto]"

      # Before anything is tagged: a missing or too long text stops here.
      - name: Read what the release says
        id: texts
        run: |
          # Without blank lines, and without spaces around each line.
          read_text() {
            [ -f "$1" ] || return 0
            sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "$1" | sed '/^$/d'
          }

          SUMMARY=$(read_text RELEASE_SUMMARY.txt)
          if [ -z "$SUMMARY" ]; then
            echo "::error::Commit the release's one-line summary to RELEASE_SUMMARY.txt on main (AltStore shows it), then start the release again"
            exit 1
          fi
          if [[ "$SUMMARY" == *$'\n'* ]]; then
            echo "::error::RELEASE_SUMMARY.txt should be one line (AltStore's description); longer notes go in RELEASE_NOTES.md"
            exit 1
          fi

          # Its paragraphs and lists keep their blank lines.
          WHAT_TO_TEST=""
          if [ -f WHAT_TO_TEST.txt ]; then
            WHAT_TO_TEST=$(cat WHAT_TO_TEST.txt)
          fi
          if [ -z "${WHAT_TO_TEST//[[:space:]]/}" ]; then
            WHAT_TO_TEST=$SUMMARY
          fi
          if (( ${#WHAT_TO_TEST} > 4000 )); then
            echo "::error::TestFlight takes up to 4000 characters of What to Test, WHAT_TO_TEST.txt has ${#WHAT_TO_TEST}"
            exit 1
          fi

          printf '%s\n' "$WHAT_TO_TEST" > "$RUNNER_TEMP/what_to_test.txt"
          if [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md "$RUNNER_TEMP/notes.md"
          else
            printf '%s\n' "$SUMMARY" > "$RUNNER_TEMP/notes.md"
          fi
          # One line, so it can't add outputs of its own.
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Work out the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi

          LAST_TAG_BUILD=$(git tag --list 'v*+*' | sed -E 's/.*\+([0-9]+)$/\1/' | sort -n | tail -1)
          BUILD=$(python .github/scripts/next_build_number.py "$BUNDLE_ID" "$(( ${LAST_TAG_BUILD:-0} + 1 ))")
          TAG="v$VERSION+$BUILD"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

          echo "Releasing $TAG"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git rm -q --ignore-unmatch RELEASE_SUMMARY.txt RELEASE_NOTES.md WHAT_TO_TEST.txt

          mkdir -p ios/TestFlight
          cp "$RUNNER_TEMP/what_to_test.txt" ios/TestFlight/WhatToTest.en-US.txt
          git add ios/TestFlight/WhatToTest.en-US.txt

          sed -i -E "s/^version: .*/version: $VERSION+$BUILD/" pubspec.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $TAG"
          git tag "$TAG"
          git push origin main
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

  # A release made with GITHUB_TOKEN doesn't trigger release_build.yml, so
  # build here instead.
  build:
    needs: prepare
    uses: ./.github/workflows/_build.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      release_tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit

  publish:
    name: Upload artifacts and update source.json
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
      NOTES: ${{ needs.prepare.outputs.summary }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to release
        run: gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY"

      - name: Add version to source.json
        run: |
          IPA=$(ls artifacts/*.ipa | head -1)
          python3 .github/scripts/add_source_version.py "$TAG" "$IPA" "$NOTES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: add $TAG to source.json"
          git pull --rebase origin main
          git push origin main
