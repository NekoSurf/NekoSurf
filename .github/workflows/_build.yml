name: Build APK and IPA (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag, SHA or PR ref to build (empty = triggering ref)"
        type: string
        default: ""
      release_tag:
        description: "Tag like v1.2.3+45; sets build name/number when it matches"
        type: string
        default: ""
      build_android:
        type: boolean
        default: true
      build_ios:
        type: boolean
        default: true

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: ${{ inputs.build_android }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - run: flutter pub get

      # Every published APK must be signed with the same release key, or
      # Android won't install it over the previous version. Release builds
      # fail without the key; dev builds fall back to a throwaway debug key.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ -n "$RELEASE_TAG" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed APK."
              exit 1
            fi
            echo "::warning::No release keystore secret; this APK is debug-signed and can't update an installed release."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
        shell: bash

      - name: Build APK
        env:
          GRADLE_OPTS: -Xmx2048m
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION_ARGS=""
          if [[ "$RELEASE_TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            VERSION_ARGS="--build-name=${BASH_REMATCH[1]} --build-number=${BASH_REMATCH[2]}"
          fi
          flutter build apk --split-per-abi $VERSION_ARGS
        shell: bash

      - name: Check APK signature
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" | grep -E "DN:|SHA-256" | sed "s|^|$(basename "$apk"): |"
            if [ -n "$RELEASE_TAG" ] && "$APKSIGNER" verify --print-certs "$apk" | grep -q "CN=Android Debug"; then
              echo "::error::$(basename "$apk") is debug-signed."
              exit 1
            fi
          done
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: nekosurf-apk
          path: build/app/outputs/apk/release/*.apk

  build_ipa:
    name: Build iOS IPA
    runs-on: xcode-27
    if: ${{ inputs.build_ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - run: flutter pub get

      - name: Build iOS app
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION_ARGS=""
          if [[ "$RELEASE_TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            VERSION_ARGS="--build-name=${BASH_REMATCH[1]} --build-number=${BASH_REMATCH[2]}"
          fi
          flutter build ios --release --no-codesign $VERSION_ARGS
        shell: bash

      - name: Create IPA
        run: |
          APP_DIR="build/ios/Release-iphoneos"
          OUTPUT_DIR="build/ios/ipa"
          APP_NAME=$(find "$APP_DIR" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_NAME" ]; then
            echo "No .app found in $APP_DIR"
            exit 1
          fi
          APP_BASENAME=$(basename "$APP_NAME" .app)
          mkdir -p "$OUTPUT_DIR/Payload"
          cp -r "$APP_NAME" "$OUTPUT_DIR/Payload/"
          cd "$OUTPUT_DIR"
          zip -r "$APP_BASENAME.ipa" Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: nekosurf-ipa
          path: build/ios/ipa/*.ipa
