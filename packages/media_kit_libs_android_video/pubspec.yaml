name: media_kit_libs_android_video
description: NekoSurf's copy of media_kit_libs_android_video 1.3.8, with libmpv-android-video-build's encoders-gpl libraries (FFmpeg encoders and fftools) instead of the playback-only ones.
version: 1.3.8+encodersgpl
homepage: https://github.com/media-kit/media-kit.git
repository: https://github.com/media-kit/media-kit.git
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.4"

dependencies:
  flutter:
    sdk: flutter

  plugin_platform_interface: ^2.1.8


flutter:
  plugin:
    platforms:
      android:
        package: com.alexmercerind.media_kit_libs_android_video
        pluginClass: MediaKitLibsAndroidVideoPlugin
